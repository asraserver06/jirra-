name: Jira CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Type-Check Server
        working-directory: ./server
        run: npx tsc --noEmit

      - name: Run Backend Integration Tests (Vitest + Supertest)
        working-directory: ./server
        run: npm test

  frontend-build:
    name: Frontend TypeCheck & Next.js Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Next.js App Router
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
