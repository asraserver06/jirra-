version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jira-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jira-app
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jira-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/jira-app
      JWT_SECRET: jira-production-secret-token-key-change-me
      JWT_REFRESH_SECRET: jira-production-refresh-secret-token-key
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb

volumes:
  mongo-data:
